<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/app-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="expendX" />
  <title>expendX - Personal Finance Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://wulhjbwijgbticuslygm.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://wulhjbwijgbticuslygm.supabase.co">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
  <!-- Native HTML Splash Screen (Capacitor Only) -->
  <style>
    #native-splash {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 999999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 1rem;
      transition: opacity 0.3s ease-out;
    }

    #native-splash.visible {
      display: flex;
    }

    #native-splash img {
      height: 2.5rem;
      /* h-10 */
      object-fit: contain;
      animation: native-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .native-loading-bar-container {
      width: 3rem;
      /* w-12 */
      height: 0.25rem;
      /* h-1 */
      background-color: rgba(255, 255, 255, 0.1);
      /* bg-white/10 */
      border-radius: 9999px;
      /* rounded-full */
      overflow: hidden;
    }

    .native-loading-bar {
      height: 100%;
      background-color: #34d399;
      /* bg-emerald-400 */
      width: 50%;
      border-radius: 9999px;
      animation: native-slide 1.5s linear infinite;
    }

    @media (min-width: 640px) {
      #native-splash img {
        height: 3rem;
        /* sm:h-12 */
      }
    }

    @keyframes native-pulse {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    @keyframes native-slide {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(200%);
      }
    }
  </style>

  <div id="native-splash">
    <img src="/app-icon.png" alt="Loading ExpendX" />
    <div class="native-loading-bar-container">
      <div class="native-loading-bar"></div>
    </div>
  </div>

  <script>
    // Only show the native splash before React boots if we are in a Capacitor environment
    if (window.Capacitor) {
      document.getElementById('native-splash').classList.add('visible');
    }
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
