<body class="min-h-screen flex items-center justify-center p-md md:p-xl selection:bg-primary-container selection:text-white">
<!-- Auth Container -->
<main class="w-full max-w-[480px] space-y-lg animate-in fade-in slide-in-from-bottom-4 duration-1000">
<!-- Brand Identity -->
<header class="flex flex-col items-center text-center space-y-sm mb-xl">
<div class="w-12 h-12 bg-primary flex items-center justify-center rounded-xl mb-md">
<span class="material-symbols-outlined text-white text-3xl">account_balance_wallet</span>
</div>
<h1 class="font-display text-headline-md md:text-headline-lg text-primary tracking-tight">ExpendX</h1>
<p class="font-body-md text-on-surface-variant max-w-[320px]">Precision financial management for high-net-worth professionals.</p>
</header>
<!-- Authentication Card -->
<section class="glass-card rounded-[24px] overflow-hidden p-lg md:p-xl">
<!-- Tabs -->
<nav aria-label="Authentication tabs" class="flex border-b border-outline-variant/20 mb-xl">
<button class="flex-1 pb-md font-label-md text-label-md text-primary border-b-2 border-primary transition-all duration-300" id="signInTab" onclick="switchTab('signin')">
                    Sign In
                </button>
<button class="flex-1 pb-md font-label-md text-label-md text-on-surface-variant border-b-2 border-transparent hover:text-primary transition-all duration-300" id="registerTab" onclick="switchTab('register')">
                    Register
                </button>
</nav>
<!-- Social Provider -->
<div class="space-y-md">
<button class="w-full flex items-center justify-center gap-sm px-lg py-md bg-white border border-outline-variant/30 rounded-full hover:bg-surface-container-low active:scale-[0.98] transition-all duration-200">

<span class="font-label-md text-label-md text-on-surface">Continue with Google</span>
</button>
<div class="flex items-center gap-md py-md">
<div class="h-[1px] flex-1 bg-outline-variant/20"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest text-[10px]">or email</span>
<div class="h-[1px] flex-1 bg-outline-variant/20"></div>
</div>
<!-- Form -->

<div class="space-y-sm">

</div>

<div class="absolute -bottom-1/4 -left-1/4 w-full h-full bg-[radial-gradient(circle,rgba(229,226,225,0.2)_0%,transparent_60%)]"></div>
</div>
<script>
        function switchTab(type) {
            const signInTab = document.getElementById('signInTab');
            const registerTab = document.getElementById('registerTab');
            
            if (type === 'signin') {
                signInTab.classList.add('text-primary', 'border-primary');
                signInTab.classList.remove('text-on-surface-variant', 'border-transparent');
                registerTab.classList.remove('text-primary', 'border-primary');
                registerTab.classList.add('text-on-surface-variant', 'border-transparent');
            } else {
                registerTab.classList.add('text-primary', 'border-primary');
                registerTab.classList.remove('text-on-surface-variant', 'border-transparent');
                signInTab.classList.remove('text-primary', 'border-primary');
                signInTab.classList.add('text-on-surface-variant', 'border-transparent');
            }
        }

        // Add subtle hover effect for the form container
        const card = document.querySelector('.glass-card');
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (x > 0 && y > 0 && x < rect.width && y < rect.height) {
                card.style.borderColor = 'rgba(0, 0, 0, 0.08)';
            } else {
                card.style.borderColor = 'rgba(0, 0, 0, 0.03)';
            }
        });
    </script>
